[package]
name = "promo"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "Config-driven short-form promo / vertical ad template on the datavid harness: gameplay shots with push-ins, alpha motion overlays with their SFX, optional word-by-word captions, end card, flashes, procedural or external music, optional voice-over, -14 LUFS mastering, built-in QA."

[lib]
path = "src/lib.rs"

[[bin]]
name = "promo"
path = "src/main.rs"

[dependencies]
datavid = { path = "../datavid" }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
toml = { version = "0.8", features = ["preserve_order"] }
anyhow = "1"
png = "0.17"
ttf-parser = "0.25"

# Linux / macOS: a static, portable FFmpeg (prebuilt archive) linked into the binary. Windows: link the FFmpeg found
# through FFMPEG_DIR or vcpkg (see README).
[target.'cfg(not(windows))'.dependencies]
fframes = { version = "=1.2.1-rc.30", features = ["cli", "build-portable"] }

[target.'cfg(windows)'.dependencies]
fframes = { version = "=1.2.1-rc.30", features = ["cli"] }
