[package]
name = "reelsmith"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "MCP server (stdio) for config-driven short-form promo videos: list and probe clips, write a brief, render 360p/720p/1080p with QA."

[[bin]]
name = "reelsmith"
path = "src/main.rs"

[dependencies]
promo = { path = "../promo", features = ["schema"] }
datavid = { path = "../datavid" }
rmcp = { version = "3.6", features = ["server", "macros", "schemars", "transport-io"] }
schemars = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "io-std"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = { version = "0.8", features = ["preserve_order"] }
anyhow = "1"
resvg = "0.48"
